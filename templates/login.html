<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#BA7517" />
<title>Prijava – Pčelarska Radionica</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --amber: #BA7517;
  --amber-hover: #8a5410;
  --amber-light: #FAEEDA;
  --amber-dark: #633806;
  --bg: #ffffff;
  --bg2: #f5f4f0;
  --border: rgba(0,0,0,0.12);
  --text: #1a1a18;
  --muted: #6b6a65;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1b18; --bg2: #26251f;
    --border: rgba(255,255,255,0.1);
    --text: #f0ede4; --muted: #9b9a94;
  }
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg2);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 2rem;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.logo {
  text-align: center;
  margin-bottom: 1.5rem;
}
.logo-icon {
  font-size: 2.5rem;
  line-height: 1;
}
.logo h1 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--amber);
  margin-top: 0.4rem;
}
label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 0.3rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
input {
  width: 100%;
  padding: 0.65rem 0.8rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg2);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: var(--amber); }
.field { margin-bottom: 1rem; }
.btn {
  width: 100%;
  padding: 0.7rem;
  background: var(--amber);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 0.5rem;
  transition: background 0.15s;
}
.btn:hover { background: var(--amber-hover); }
.error {
  background: #fef2f2;
  border: 1px solid #fca5a5;
  color: #b91c1c;
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
  font-size: 0.88rem;
  margin-bottom: 1rem;
}
@media (prefers-color-scheme: dark) {
  .error { background: #2d1515; border-color: #7f1d1d; color: #fca5a5; }
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🍯</div>
    <h1>Pčelarska Radionica</h1>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label for="username">Korisničko ime</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required />
    </div>
    <div class="field">
      <label for="password">Lozinka</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn">Prijavi se</button>
  </form>
</div>
</body>
</html>
